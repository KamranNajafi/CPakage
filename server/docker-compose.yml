version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cpakage
      POSTGRES_USER: cpakage
      POSTGRES_PASSWORD: cpakage
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://cpakage:cpakage@db/cpakage
      SECRET_KEY: change-this-in-production
      STORAGE_DIR: /storage
    volumes:
      - ./storage:/storage
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pg_data:
